<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OTT Cafe — Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ee;color:#171717;font-family:Inter,system-ui,sans-serif}.top{background:#171717;color:#fff;padding:16px 22px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}.top b{font-size:20px}.top small{color:#aaa}.wrap{max-width:1250px;margin:auto;padding:22px}.login{max-width:400px;margin:90px auto;background:#fff;border:1px solid #e7e2d8;padding:28px;border-radius:24px}.login h1{margin-top:0}.input{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;margin:8px 0 14px}.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:800;cursor:pointer}.dark{background:#171717;color:#fff}.gold{background:#e7a43b}.danger{background:#f7d4d1}.nav{display:flex;gap:8px;overflow:auto;margin-bottom:20px}.nav button{white-space:nowrap;background:#fff;border:1px solid #e3ded5}.nav button.active{background:#171717;color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.stat{background:#fff;border:1px solid #e7e2d8;border-radius:18px;padding:18px}.stat strong{display:block;font-size:28px;margin-top:8px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}.panel{background:#fff;border:1px solid #e7e2d8;border-radius:20px;padding:18px;margin-bottom:18px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee}.row:last-child{border-bottom:0}.actions{display:flex;gap:7px;flex-wrap:wrap}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;text-align:left;border-bottom:1px solid #eee;font-size:13px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:50;padding:18px}.modal.show{display:flex}.box{background:#fff;width:min(620px,100%);max-height:90vh;overflow:auto;border-radius:22px;padding:22px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.muted{color:#777;font-size:12px}.logoPreview{width:100px;height:100px;border-radius:20px;object-fit:cover;background:#eee}.hide{display:none}@media(max-width:850px){.grid,.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.wrap{padding:13px}.grid,.stats,.formgrid{grid-template-columns:1fr}.top{padding:13px}}
</style>
<style>
.loading{display:flex;align-items:center;gap:10px;padding:28px 4px;color:#777}.spinner{width:18px;height:18px;border:3px solid #e5e1d9;border-top-color:#171717;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.errorBox{background:#fff1ef;border:1px solid #f1c4bd;border-radius:14px;padding:16px;color:#8b2f27}
</style>
</head>
<body>
<header class="top"><b>OTT Cafe</b><small>Admin Control Center</small><span style="margin-left:auto" id="who"></span></header>
<div id="login" class="login"><h1>Admin Login</h1><p class="muted">Enter the cafe admin PIN.</p><input class="input" id="pin" type="password" placeholder="Admin PIN"><button class="btn dark" style="width:100%" onclick="login()">Login</button><p id="loginErr" class="muted"></p></div>
<div id="app" class="wrap hide">
<div class="nav"><button class="btn active" onclick="tab('dashboard',this)">Dashboard</button><button class="btn" onclick="tab('menu',this)">Menu</button><button class="btn" onclick="tab('orders',this)">Orders</button><button class="btn" onclick="tab('settings',this)">Settings</button></div>
<div id="loadState" class="loading"><span class="spinner"></span><span>Loading admin data...</span></div><section id="dashboard"></section><section id="menu" class="hide"></section><section id="orders" class="hide"></section><section id="settings" class="hide"></section>
</div>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="box" id="modalBox"></div></div>
<script>
const API="https://script.google.com/macros/s/AKfycbz7yb3tgktradoesZOjXJTDqoYoFt-AHOJfgXX_K8mNjaKBWMDr2vLvzLDrXFI7qbsn2Q/exec";
let token=localStorage.getItem("ottAdminToken")||"",data={categories:[],products:[],variations:[],orders:[],settings:{}},refreshing=null;
async function api(action,body={}){
 const payload=Object.assign({action,token},body);
 const request=(url,options)=>{const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),15000);return fetch(url,Object.assign({},options,{signal:controller.signal})).finally(()=>clearTimeout(timeout))};
 const r=await request(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});return r.json()
}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function money(n){return "₹"+Number(n||0).toFixed(0)}
function showLogin(message=""){token="";localStorage.removeItem("ottAdminToken");document.getElementById("app").classList.add("hide");document.getElementById("login").classList.remove("hide");document.getElementById("loginErr").textContent=message}
async function login(){const pin=document.getElementById("pin").value.trim(),button=document.querySelector("#login button");if(!pin)return;button.disabled=true;document.getElementById("loginErr").textContent="Checking PIN...";try{const r=await api("adminLogin",{pin});if(!r.success){document.getElementById("loginErr").textContent=r.error||"Login failed";return}token=r.token;localStorage.setItem("ottAdminToken",token);document.getElementById("login").classList.add("hide");document.getElementById("app").classList.remove("hide");await refresh()}catch(e){document.getElementById("loginErr").textContent="Could not connect. Please try again."}finally{button.disabled=false}}
async function refresh(){if(refreshing)return refreshing;const state=document.getElementById("loadState");state.innerHTML='<span class="spinner"></span><span>Loading admin data...</span>';state.className="loading";refreshing=(async()=>{try{const results=await Promise.all([api("adminGetMenu"),api("adminGetOrders",{limit:100}),api("adminGetSettings")]);const failed=results.find(r=>!r.success);if(failed){if(/token|session|auth|login|expired/i.test(failed.error||"")){showLogin("Your admin session expired. Please sign in again.");return}state.className="errorBox";state.innerHTML=`<b>Could not load admin data.</b><br>${esc(failed.error||"Please try again.")}<br><button class="btn dark" style="margin-top:12px" onclick="refresh()">Retry</button>`;return}data={categories:results[0].categories||[],products:results[0].products||[],variations:results[0].variations||[],orders:results[1].orders||[],settings:results[2].settings||{}};state.classList.add("hide");renderDashboard();renderMenu();renderOrders();renderSettings()}catch(e){state.className="errorBox";state.innerHTML='<b>Could not connect to the admin service.</b><br>Check your connection and retry.<br><button class="btn dark" style="margin-top:12px" onclick="refresh()">Retry</button>'}})();try{await refreshing}finally{refreshing=null}}
function tab(id,b){document.querySelectorAll("#app>section").forEach(x=>x.classList.add("hide"));document.getElementById(id).classList.remove("hide");document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active")}
function renderDashboard(){const o=data.orders;const revenue=o.filter(x=>x.paymentStatus==="PAID").reduce((s,x)=>s+Number(x.total||0),0);document.getElementById("dashboard").innerHTML=`<div class="stats"><div class="stat">Orders<strong>${o.length}</strong></div><div class="stat">New<strong>${o.filter(x=>x.orderStatus==="NEW").length}</strong></div><div class="stat">Products<strong>${data.products.length}</strong></div><div class="stat">Paid revenue<strong>${money(revenue)}</strong></div></div><div class="panel"><h2>Quick actions</h2><div class="actions"><button class="btn gold" onclick="openProduct()">+ Product</button><button class="btn gold" onclick="openCategory()">+ Category</button><button class="btn dark" onclick="openLogo()">Update logo</button></div></div>`}
function renderMenu(){document.getElementById("menu").innerHTML=`<div class="panel"><div class="row"><div><h2>Menu & Variations</h2><span class="muted">Create products and unlimited price variations.</span></div><button class="btn gold" onclick="openProduct()">+ Product</button></div>${data.categories.map(c=>`<div class="row"><div><b>${esc(c.name)}</b><div class="muted">${data.products.filter(p=>String(p.categoryId)===String(c.id)).length} products</div></div><div class="actions"><button class="btn" onclick="openCategory('${c.id}')">Edit</button><button class="btn danger" onclick="deleteCat('${c.id}')">Delete</button></div></div>`).join("")}</div>
<div class="grid">${data.products.map(p=>{const vs=data.variations.filter(v=>String(v.productId)===String(p.id));return `<div class="panel"><b>${esc(p.name)}</b><div class="muted">${money(p.basePrice)} base</div>${vs.map(v=>`<div class="row"><span>${esc(v.name)}</span><span>${money(v.price)} <button class="btn" onclick="openVariation('${v.id}')">Edit</button></span></div>`).join("")}<div class="actions" style="margin-top:10px"><button class="btn dark" onclick="openProduct('${p.id}')">Edit product</button><button class="btn gold" onclick="openVariation('', '${p.id}')">+ Variation</button></div></div>`}).join("")}</div>`}
function renderOrders(){document.getElementById("orders").innerHTML=`<div class="panel"><h2>Orders</h2><div style="overflow:auto"><table class="table"><tr><th>ID</th><th>Customer</th><th>Total</th><th>Payment</th><th>Status</th><th>Action</th></tr>${data.orders.map(o=>`<tr><td>${esc(o.orderId)}</td><td>${esc(o.customerName)}<br><span class="muted">${esc(o.phone)}</span></td><td>${money(o.total)}</td><td>${esc(o.paymentStatus)}</td><td>${esc(o.orderStatus)}</td><td><select onchange="status('${o.orderId}',this.value)">${["NEW","ACCEPTED","PREPARING","READY","COMPLETED","CANCELLED"].map(s=>`<option ${s===o.orderStatus?"selected":""}>${s}</option>`).join("")}</select></td></tr>`).join("")}</table></div></div>`}
function renderSettings(){const s=data.settings;document.getElementById("settings").innerHTML=`<div class="panel"><h2>Cafe Settings</h2><div class="formgrid"><div><label>Cafe name</label><input class="input" id="setName" value="${esc(s.cafeName||"OTT Cafe")}"></div><div><label>Tagline</label><input class="input" id="setTag" value="${esc(s.tagline||"Out Of The Town")}"></div><div><label>Phone</label><input class="input" id="setPhone" value="${esc(s.phone||"")}"></div><div><label>WhatsApp</label><input class="input" id="setWA" value="${esc(s.whatsapp||"")}"></div><div class="full"><label>Address</label><input class="input" id="setAddress" value="${esc(s.address||"")}"></div><div class="full"><label>Announcement</label><input class="input" id="setAnn" value="${esc(s.announcement||"")}"></div></div><button class="btn gold" onclick="saveSettings()">Save settings</button></div><div class="panel"><h2>Logo</h2>${s.logo?`<img class="logoPreview" src="${s.logo}">`:"<p class='muted'>No logo uploaded.</p>"}<br><button class="btn dark" onclick="openLogo()">Upload / replace logo</button></div>`}
function openModal(html){document.getElementById("modalBox").innerHTML=html;document.getElementById("modal").classList.add("show")}function closeModal(){document.getElementById("modal").classList.remove("show")}
function openCategory(id){const c=data.categories.find(x=>String(x.id)===String(id))||{};openModal(`<h2>${id?"Edit":"Add"} category</h2><input class="input" id="fName" placeholder="Category name" value="${esc(c.name||"")}"><input class="input" id="fDesc" placeholder="Description" value="${esc(c.description||"")}"><input class="input" id="fOrder" type="number" placeholder="Sort order" value="${c.sortOrder||99}"><button class="btn gold" onclick="saveCategory('${id||""}')">Save</button>`) }
async function saveCategory(id){const r=await api("saveCategory",{id,name:document.getElementById("fName").value,description:document.getElementById("fDesc").value,sortOrder:document.getElementById("fOrder").value});if(!r.success)return alert(r.error);closeModal();refresh()}
async function deleteCat(id){if(!confirm("Delete this category?"))return;const r=await api("deleteCategory",{id});if(!r.success)return alert(r.error);refresh()}
function openProduct(id){const p=data.products.find(x=>String(x.id)===String(id))||{};openModal(`<h2>${id?"Edit":"Add"} product</h2><div class="formgrid"><select class="input" id="pCat"><option value="">Category</option>${data.categories.map(c=>`<option value="${c.id}" ${String(c.id)===String(p.categoryId)?"selected":""}>${esc(c.name)}</option>`).join("")}</select><input class="input" id="pName" placeholder="Product name" value="${esc(p.name||"")}"><input class="input" id="pPrice" type="number" placeholder="Base price" value="${p.basePrice||0}"><input class="input" id="pOrder" type="number" placeholder="Sort order" value="${p.sortOrder||99}"><input class="input full" id="pImg" placeholder="Image URL (optional)" value="${esc(p.image||"")}"><textarea class="input full" id="pDesc" placeholder="Description">${esc(p.description||"")}</textarea></div><button class="btn gold" onclick="saveProduct('${id||""}')">Save product</button>`) }
async function saveProduct(id){const r=await api("saveProduct",{id,categoryId:document.getElementById("pCat").value,name:document.getElementById("pName").value,basePrice:document.getElementById("pPrice").value,sortOrder:document.getElementById("pOrder").value,image:document.getElementById("pImg").value,description:document.getElementById("pDesc").value});if(!r.success)return alert(r.error);closeModal();refresh()}
function openVariation(id,pid){const v=data.variations.find(x=>String(x.id)===String(id))||{};pid=pid||v.productId;openModal(`<h2>${id?"Edit":"Add"} variation</h2><select class="input" id="vProd">${data.products.map(p=>`<option value="${p.id}" ${String(p.id)===String(pid)?"selected":""}>${esc(p.name)}</option>`).join("")}</select><input class="input" id="vName" placeholder="Variation name e.g. ₹20 / Small" value="${esc(v.name||"")}"><input class="input" id="vPrice" type="number" placeholder="Price" value="${v.price||0}"><input class="input" id="vOrder" type="number" placeholder="Sort order" value="${v.sortOrder||99}"><button class="btn gold" onclick="saveVariation('${id||""}')">Save variation</button>`) }
async function saveVariation(id){const r=await api("saveVariation",{id,productId:document.getElementById("vProd").value,name:document.getElementById("vName").value,price:document.getElementById("vPrice").value,sortOrder:document.getElementById("vOrder").value});if(!r.success)return alert(r.error);closeModal();refresh()}
async function status(id,status){const r=await api("updateOrderStatus",{orderId:id,status});if(!r.success)alert(r.error);else refresh()}
async function saveSettings(){const r=await api("updateSettings",{settings:{cafeName:document.getElementById("setName").value,tagline:document.getElementById("setTag").value,phone:document.getElementById("setPhone").value,whatsapp:document.getElementById("setWA").value,address:document.getElementById("setAddress").value,announcement:document.getElementById("setAnn").value}});if(!r.success)return alert(r.error);refresh()}
function openLogo(){openModal(`<h2>Update OTT Cafe Logo</h2><p class="muted">Use a small JPG/PNG/WebP image. It will be compressed in your browser.</p><input class="input" type="file" accept="image/*" id="logoFile"><button class="btn gold" onclick="uploadLogo()">Upload logo</button>`)}
async function uploadLogo(){const f=document.getElementById("logoFile").files[0];if(!f)return alert("Choose an image");const img=new Image(),url=URL.createObjectURL(f);img.onload=async()=>{const c=document.createElement("canvas"),max=500,scale=Math.min(1,max/Math.max(img.width,img.height));c.width=img.width*scale;c.height=img.height*scale;c.getContext("2d").drawImage(img,0,0,c.width,c.height);const logo=c.toDataURL("image/webp",.75);if(logo.length>48000)return alert("Image still too large");const r=await api("updateLogo",{logo});if(!r.success)return alert(r.error);closeModal();refresh();URL.revokeObjectURL(url)};img.src=url}
</script>
<script>if(token){document.getElementById("login").classList.add("hide");document.getElementById("app").classList.remove("hide");refresh()}</script>
</body>
</html>
